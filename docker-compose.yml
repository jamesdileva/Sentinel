# Project Sentinel — core services (docs/02 §13.1)
#
# Home development server (docs/01 §Infrastructure Services): the laptop
# (192.168.4.40) hosts Pi-hole (ad blocking) and Ollama (shared AI); this
# compose file is the single source of truth, deployed on both machines.
#
# Default `docker compose up` starts backend + frontend + redis
# (+ worker/scheduler). Add AI: `--profile ollama` (local fallback only).
# Ad-block: `--profile pihole` (deployed on the laptop).
# Dev mode: docker-compose.override.yml is merged automatically.
#
# Overridable via a gitignored `.env` (see .env.example):
#   SENTINEL_OLLAMA_HOST      AI host (default: shared laptop Ollama)
#   SENTINEL_PROJECTS_DIR     host path mounted at /data/projects — point this
#                             at a local folder (laptop) or leave as ./data/projects
#                             (dev). On the laptop, repos are cloned/pulled here
#                             from GitHub by the repo-sync beat task (Sprint 12.1).
#   SENTINEL_GITHUB_TOKEN     read-only PAT; enables auto clone/pull of repos
#   SENTINEL_PIHOLE_PASSWORD  used by the System page to auth to Pi-hole v6

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "${SENTINEL_API_PORT:-8000}:8000"
    volumes:
      - ./data:/data
      - "${SENTINEL_PROJECTS_DIR:-./data/projects}:/data/projects"
    environment:
      SENTINEL_DB_PATH: /data/sqlite/sentinel.db
      SENTINEL_CHROMA_PATH: /data/chroma
      SENTINEL_OLLAMA_HOST: ${SENTINEL_OLLAMA_HOST:-http://192.168.4.40:11434}
      SENTINEL_WATCH_DIRS: '["/data/projects"]'
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_GITHUB_TOKEN: ${SENTINEL_GITHUB_TOKEN:-}
      SENTINEL_SYNC_INTERVAL_MINUTES: ${SENTINEL_SYNC_INTERVAL_MINUTES:-15}
      SENTINEL_PIHOLE_HOST: ${SENTINEL_PIHOLE_HOST:-}
      SENTINEL_PIHOLE_PASSWORD: ${SENTINEL_PIHOLE_PASSWORD:-}
    depends_on:
      - redis
    restart: unless-stopped

  # Production web dashboard — multi-stage Node build + nginx (Sprint 12).
  # Serves the app at http://<host>:8080 and proxies /api to backend.
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Celery worker — consumes build/test/scan jobs enqueued by the API (Sprint 7).
  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "-P", "solo"]
    volumes:
      - ./data:/data
      - "${SENTINEL_PROJECTS_DIR:-./data/projects}:/data/projects"
    environment:
      SENTINEL_DB_PATH: /data/sqlite/sentinel.db
      SENTINEL_CHROMA_PATH: /data/chroma
      SENTINEL_OLLAMA_HOST: ${SENTINEL_OLLAMA_HOST:-http://192.168.4.40:11434}
      SENTINEL_WATCH_DIRS: '["/data/projects"]'
      SENTINEL_REDIS_URL: redis://redis:6379/0
      SENTINEL_GITHUB_TOKEN: ${SENTINEL_GITHUB_TOKEN:-}
      SENTINEL_SYNC_INTERVAL_MINUTES: ${SENTINEL_SYNC_INTERVAL_MINUTES:-15}
      SENTINEL_PIHOLE_HOST: ${SENTINEL_PIHOLE_HOST:-}
      SENTINEL_PIHOLE_PASSWORD: ${SENTINEL_PIHOLE_PASSWORD:-}
    depends_on:
      - redis
    restart: unless-stopped

  # Celery beat — schedules the nightly security scan (Sprint 7).
  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO"]
    environment:
      SENTINEL_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  # Optional AI backend; enable with `--profile ollama`.
  # Sprint 8.5: the laptop (192.168.4.40) is the primary Ollama host; this
  # profile remains a local fallback for the desktop.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    restart: unless-stopped

  # Network-wide ad/tracker blocking — deployed on the laptop (Sprint 8.5).
  # Pi-hole v6 env vars; admin UI on http://<laptop-ip>:8053.
  # Set PIHOLE_WEBPASSWORD in a gitignored .env (see docs/02 §13.3).
  pihole:
    image: ghcr.io/pi-hole/pihole:latest
    profiles: ["pihole"]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8053:80/tcp"
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
      - ./data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    environment:
      FTLCONF_LOCAL_IPV4: 192.168.4.40
      FTLCONF_webpassword: ${PIHOLE_WEBPASSWORD}
      TZ: ${PIHOLE_TZ:-UTC}
    restart: unless-stopped
