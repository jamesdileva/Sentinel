[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Project Sentinel backend — local-first software operations platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.20",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "chromadb>=0.5",
    # v1.17.10: session screenshots (later.md Tier 4) — full-screen grab via
    # PIL.ImageGrab + 90x60 thumbnail generation.
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
]

[project.scripts]
sentinel = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "node_modules", ".venv"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.isort]
profile = "black"
line_length = 100
