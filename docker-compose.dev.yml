# Project Sentinel — dev mode overrides (docs/02 §5.2)
#
# Loaded EXPLICITLY by `python scripts/dev.py` via
#   -f docker-compose.yml -f docker-compose.dev.yml
# NOT auto-merged, so a plain `docker compose up` on the laptop is production.
#
# Live source mount + uvicorn hot-reload for local development.

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./data/projects:/data/projects