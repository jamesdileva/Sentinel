# Project Sentinel — nginx reverse proxy + static host (docs/02 §13.1)
#
# Serves the built React dashboard on :80 and proxies every /api request to
# the backend container, so the whole app runs at a single origin
# (http://<host>:8080) with no CORS pain on any LAN device.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing owns the paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API + websocket passthrough.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade (job updates channel).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets cache headers.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}