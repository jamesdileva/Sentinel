# Project Sentinel — dev mode overrides (auto-merged by `docker compose up`)
#
# Live source mount + uvicorn hot-reload for local development.

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./data/projects:/data/projects
